name: Publish to npm

# Fully automatic CD: bump "version" in package.json, commit, push to main.
# That is the entire procedure. No tag to create, no GitHub Release to cut, no
# maintainer approval step.
#
# The version in package.json is the single source of truth. The already-published
# check below makes this safe to run on every push: a push that does not change
# the version finds that version on the registry and exits successfully without
# doing anything, so ordinary pushes are no-ops rather than failures.
on:
  push:
    branches: [main]
  workflow_dispatch:

# npm refuses to overwrite a published version. Serialising on the repository
# also stops two pushes landing on the registry at the same instant.
concurrency:
  group: npm-publish-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: read
  # This is what makes trusted publishing work: the runner exchanges this
  # workflow's identity for a short-lived OIDC token, which npm verifies against
  # the Trusted Publisher configured for this repository. Provenance attestation
  # comes from the same exchange, so no --provenance flag is needed.
  id-token: write

jobs:
  publish:
    name: Build and publish
    runs-on: ubuntu-latest
    # Every step here runs in bash, including the guard logic below.
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # Version comes from the packageManager field in package.json, so CI
      # always uses the same pnpm as a local checkout and cannot drift.
      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 20
          # Pins the registry. No auth token is configured, because trusted
          # publishing supplies credentials at publish time.
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build

      # package.json publishes only dist/, so a build that silently produced
      # nothing would still ship an empty package to every consumer.
      - name: Verify build output
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts

      - name: Read package metadata
        id: pkg
        run: |
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"
          echo "### Publish ${{ steps.pkg.outputs.name }}@${{ steps.pkg.outputs.version }}" >> "$GITHUB_STEP_SUMMARY"

      - name: Check if version is already published
        id: check
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          if npm view "${NAME}@${VERSION}" version > /dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already on the registry. Nothing to do."
            echo "Already published \`${NAME}@${VERSION}\` - no action taken." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "${VERSION} is not on the registry yet."
          fi

      # Direct publish, not staging. This requires the Trusted Publisher on
      # npmjs.com to have "publish directly" allowed; a stage-only configuration
      # will reject this command.
      - name: Publish to npm
        if: steps.check.outputs.published == 'false'
        run: npm publish --access public

      - name: Confirm the new version is live
        if: steps.check.outputs.published == 'false'
        run: |
          NAME="${{ steps.pkg.outputs.name }}"
          VERSION="${{ steps.pkg.outputs.version }}"
          echo "Published ${NAME}@${VERSION}"
          echo "Published \`${NAME}@${VERSION}\` to npm." >> "$GITHUB_STEP_SUMMARY"
          npm view "${NAME}@${VERSION}" version
